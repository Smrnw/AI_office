[project]
name = "ai-office"
dynamic = ["version"]
description = "AI Office: a team of AI agents in a pixel-art office"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "google-genai>=1.0",
    "playwright>=1.45",
    "bandit>=1.7",
    "pytest>=8",
    "dulwich>=0.22",
]

[project.scripts]
ai-office = "pixel_office.main:main"

[tool.setuptools]
packages = ["pixel_office", "pixel_office.agents", "pixel_office.api", "pixel_office.checks", "pixel_office.llm"]

[tool.setuptools.dynamic]
version = { attr = "pixel_office.__version__" }

[tool.setuptools.package-data]
"pixel_office.checks" = ["sandbox.Dockerfile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
